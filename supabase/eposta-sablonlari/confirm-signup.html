<!-- Supabase → Authentication → Emails → Confirm sign up
     Konu: LabStock doğrulama kodun
     Uygulama link değil 6 haneli kod bekler ({{ .Token }}). -->
<div style="background:#f2ede3;padding:32px 16px">
  <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="max-width:420px;margin:0 auto;background:#fbf8f2;border:1px solid #e4dccb;border-radius:10px;overflow:hidden;font-family:-apple-system,Segoe UI,Arial,sans-serif">
    <tr><td style="padding:28px 32px 8px;text-align:center">
      <img src="https://raw.githubusercontent.com/recepuysal/labstock/master/labstock-a1-logo/png/isaret-256.png" width="44" height="44" alt="LabStock" style="display:block;margin:0 auto 10px">
      <div style="font-size:17px;font-weight:600;color:#1f1b16;letter-spacing:-0.3px">LabStock</div>
    </td></tr>
    <tr><td style="padding:8px 32px 4px;text-align:center">
      <div style="font-size:13.5px;color:#4a4238;line-height:1.6">Doğrulama kodun</div>
    </td></tr>
    <tr><td style="padding:12px 32px 20px;text-align:center">
      <span style="display:inline-block;font-family:ui-monospace,Consolas,monospace;font-size:32px;font-weight:700;letter-spacing:6px;color:#7e4915;background:#f7f2e8;border:1px solid #e4dccb;border-radius:8px;padding:10px 18px">{{ .Token }}</span>
    </td></tr>
    <tr><td style="padding:0 32px 28px;text-align:center">
      <div style="font-size:11.5px;color:#837a6b;line-height:1.6">Bu kod 10 dakika boyunca geçerlidir. Bu isteği sen yapmadıysan bu e-postayı yok sayabilirsin.<br>Your LabStock verification code — valid for 10 minutes.</div>
    </td></tr>
  </table>
</div>
