name: Masaüstü uygulamasını derle (Windows .exe)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Next.js standalone build
        run: |
          npm ci
          npm run build:desktop
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Standalone çıktısını electron-app'e kopyala
        run: |
          Remove-Item -Recurse -Force electron-app/standalone -ErrorAction SilentlyContinue
          Copy-Item -Recurse .next/standalone electron-app/standalone

      - name: Electron ile paketle
        working-directory: electron-app
        run: |
          npm ci
          npx electron-builder --win --publish never

      - name: Sürüm notlarını hazırla
        shell: bash
        run: |
          # Uygulama içindeki güncelleme bildirimi bunu okuyor: ilk satır kısa
          # açıklama, bir boş satırdan sonraki kısım "Genişlet" ile açılan
          # ayrıntı (bkz. src/components/guncelleme-bildirimi.tsx). Commit
          # mesajı zaten bu şekilde yazılıyor - sadece Co-Authored-By
          # satırını ve başlıktaki (vX.Y.Z) ekini temizliyoruz.
          git log -1 --format=%B \
            | grep -v '^Co-Authored-By:' \
            | awk 'NR==1{gsub(/ *\(v[0-9]+\.[0-9]+\.[0-9]+\)[[:space:]]*$/,"")} {print}' \
            > release-notes.txt

      - name: Sürüme ekle
        uses: softprops/action-gh-release@v2
        with:
          files: |
            electron-app/dist/*.exe
            electron-app/dist/*.blockmap
            electron-app/dist/latest.yml
          tag_name: "${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}"
          name: "${{ github.ref_type == 'tag' && github.ref_name || format('Test derleme #{0}', github.run_number) }}"
          body_path: release-notes.txt
          prerelease: ${{ github.ref_type != 'tag' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
